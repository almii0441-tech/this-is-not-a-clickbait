<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almidha | Human Database | This Is Not Clickbait</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
/* All classes start with "tinc-" so they can't clash with your existing site. */
body { margin: 0; background: #000; }

.tinc-db {
  --tinc-ink: #f2ecef; --tinc-mute: #8d8590;
  --tinc-red: #ff3b4e; --tinc-accent: #ff8fb8;
  background: #000; color: var(--tinc-ink);
  font-family: "Space Grotesk", system-ui, sans-serif;
  min-height: 100vh;
  padding: clamp(40px, 7vw, 90px) clamp(16px, 5vw, 64px);
  position: relative; isolation: isolate;
}
.tinc-db *, .tinc-modal * { box-sizing: border-box; }
.tinc-db::before {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px);
}
.tinc-db__head { max-width: 460px; margin: 0 auto 36px; }
.tinc-db__path { font: 400 .8rem "Space Mono", monospace; color: var(--tinc-red); letter-spacing: .08em; margin: 0 0 14px; }
.tinc-db__title { font: 700 clamp(2.2rem, 9vw, 3.6rem)/.95 "Space Grotesk", sans-serif; margin: 0 0 12px; letter-spacing: -.03em; }
.tinc-db__sub { font: 400 .85rem "Space Mono", monospace; color: var(--tinc-mute); margin: 0; }

.tinc-glitch { position: relative; display: inline-block; }
.tinc-glitch::before, .tinc-glitch::after { content: attr(data-text); position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.tinc-glitch::before { color: var(--tinc-red); }
.tinc-glitch::after { color: #a78bfa; }
.tinc-glitch:hover::before { opacity: .8; animation: tinc-glitch-a .35s steps(2) infinite; }
.tinc-glitch:hover::after { opacity: .8; animation: tinc-glitch-b .35s steps(2) infinite; }
@keyframes tinc-glitch-a { 0%{transform:translate(-3px,0);clip-path:inset(10% 0 60% 0)} 100%{transform:translate(2px,0);clip-path:inset(55% 0 10% 0)} }
@keyframes tinc-glitch-b { 0%{transform:translate(3px,0);clip-path:inset(60% 0 5% 0)} 100%{transform:translate(-2px,0);clip-path:inset(5% 0 55% 0)} }

.tinc-card {
  position: relative; max-width: 460px; margin: 0 auto;
  background: #0b0a0c;
  border: 1px solid color-mix(in srgb, var(--tinc-accent) 35%, #000);
  padding: 18px 18px 22px;
  display: flex; flex-direction: column; gap: 14px;
  transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
}
.tinc-card::after {
  content: ""; position: absolute; top: -1px; right: -1px; width: 28px; height: 28px;
  background: linear-gradient(225deg, #000 50%, var(--tinc-accent) 50%);
}
.tinc-card:hover, .tinc-card:focus-within {
  transform: translateY(-6px); border-color: var(--tinc-accent);
  box-shadow: 0 0 0 1px var(--tinc-accent), 0 18px 40px -18px var(--tinc-accent);
}
.tinc-card__id { font: 700 .85rem "Space Mono", monospace; color: var(--tinc-accent); margin: 0; letter-spacing: .1em; }
.tinc-card__frame {
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--tinc-accent) 22%, transparent), transparent 70%), #050405;
  border: 1px dashed color-mix(in srgb, var(--tinc-accent) 40%, transparent);
  aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; padding: 10px;
}
.tinc-card__img, .tinc-modal__art img {
  width: 100%; height: 100%;
  object-fit: contain;            /* whole artwork, never cropped */
  display: block; animation: tinc-float 5s ease-in-out infinite;
}
@keyframes tinc-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.tinc-card__name { font: 700 1.9rem/1 "Space Grotesk", sans-serif; margin: 4px 0 0; letter-spacing: -.02em; }

.tinc-card__data, .tinc-modal__data { margin: 0; font-family: "Space Mono", monospace; font-size: .78rem; }
.tinc-card__data > div, .tinc-modal__data > div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid #1d1a1f; }
.tinc-card__data dt, .tinc-modal__data dt { color: var(--tinc-mute); }
.tinc-card__data dd, .tinc-modal__data dd { margin: 0; text-align: right; }
.tinc-card__data > div:nth-child(1) dd, .tinc-modal__data > div:nth-child(1) dd { color: var(--tinc-accent); }
.tinc-card__data > div:nth-child(3) dd, .tinc-modal__data > div:nth-child(3) dd { color: var(--tinc-red); }

.tinc-card__btn {
  margin-top: 6px; cursor: pointer; background: transparent; color: var(--tinc-accent);
  border: 1px solid var(--tinc-accent); padding: 13px 16px;
  font: 700 .85rem "Space Mono", monospace; letter-spacing: .12em; transition: background .2s, color .2s;
}
.tinc-card__btn:hover, .tinc-card__btn:focus-visible { background: var(--tinc-accent); color: #000; }
.tinc-card__btn:focus-visible, .tinc-modal__close:focus-visible { outline: 2px solid var(--tinc-ink); outline-offset: 3px; }

/* modal */
.tinc-modal { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 16px; --tinc-accent: #ff8fb8; --tinc-red: #ff3b4e; --tinc-ink: #f2ecef; --tinc-mute: #8d8590; }
.tinc-modal[hidden] { display: none; }
.tinc-modal__backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.88); backdrop-filter: blur(3px); }
.tinc-modal__panel {
  position: relative; width: min(960px, 100%); max-height: 92vh; overflow-y: auto;
  display: grid; grid-template-columns: 1fr 1.1fr;
  background: #0b0a0c; color: var(--tinc-ink); border: 1px solid var(--tinc-accent);
  box-shadow: 0 0 60px -15px var(--tinc-accent);
  font-family: "Space Grotesk", system-ui, sans-serif; animation: tinc-open .28s ease-out;
}
@keyframes tinc-open { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
.tinc-modal__close {
  position: absolute; top: 10px; right: 12px; z-index: 2; width: 40px; height: 40px; cursor: pointer;
  background: #000; color: var(--tinc-accent); border: 1px solid var(--tinc-accent); font: 400 1.6rem/1 "Space Mono", monospace;
}
.tinc-modal__close:hover { background: var(--tinc-accent); color: #000; }
.tinc-modal__art {
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--tinc-accent) 25%, transparent), transparent 70%), #050405;
  display: flex; align-items: center; justify-content: center; padding: 28px; min-height: 320px;
}
.tinc-modal__art img { max-height: 60vh; }
.tinc-modal__body { padding: 36px 32px 32px; display: flex; flex-direction: column; gap: 14px; }
.tinc-modal__id { font: 700 .85rem "Space Mono", monospace; color: var(--tinc-accent); letter-spacing: .1em; margin: 0; }
.tinc-modal__name { font: 700 clamp(2rem, 5vw, 3rem)/1 "Space Grotesk", sans-serif; margin: 0; letter-spacing: -.03em; }
.tinc-modal__label { font: 400 .75rem "Space Mono", monospace; color: var(--tinc-mute); margin: 8px 0 0; }
.tinc-modal__article { font: 600 1.15rem/1.35 "Space Grotesk", sans-serif; margin: -8px 0 0; }
.tinc-modal__error { margin-top: auto; border-left: 3px solid var(--tinc-red); background: rgba(255,59,78,.07); padding: 14px 16px; }
.tinc-modal__errhead { font: 700 .75rem "Space Mono", monospace; color: var(--tinc-red); letter-spacing: .14em; margin: 0 0 8px; }
.tinc-modal__question { font: 400 .95rem/1.5 "Space Mono", monospace; margin: 0; }
body.tinc-lock { overflow: hidden; }

@media (max-width: 720px) {
  .tinc-modal__panel { grid-template-columns: 1fr; }
  .tinc-modal__art { min-height: 0; padding: 48px 20px 16px; }
  .tinc-modal__art img { max-height: 40vh; }
  .tinc-modal__body { padding: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  .tinc-card__img, .tinc-modal__art img, .tinc-modal__panel, .tinc-glitch::before, .tinc-glitch::after { animation: none !important; }
  .tinc-card { transition: none; }
}
</style>
</head>

<body>

<section class="tinc-db" aria-labelledby="tinc-db-title">
  <header class="tinc-db__head">
    <p class="tinc-db__path">HUMAN DATABASE / MEET THE CONTRIBUTORS</p>
    <h1 class="tinc-db__title tinc-glitch" id="tinc-db-title" data-text="Almidha">Almidha</h1>
    <p class="tinc-db__sub">Record 002 of 007 loaded.</p>
  </header>

  <!-- Edit the data-article and data-question text when you have the real content -->
  <article class="tinc-card"
           data-id="002" data-name="Almidha" data-image="images/almidha.png"
           data-article="[ARTICLE TITLE: coming soon]"
           data-question="[SYSTEM ERROR QUESTION: coming soon]">
    <p class="tinc-card__id">ID 002</p>
    <div class="tinc-card__frame">
      <img class="tinc-card__img" src="images/almidha.png" alt="Illustration of contributor Almidha">
    </div>
    <h2 class="tinc-card__name">Almidha</h2>
    <dl class="tinc-card__data">
      <div><dt>Status</dt><dd>WRITING</dd></div>
      <div><dt>Human level</dt><dd>QUESTIONABLE</dd></div>
      <div><dt>Digital footprint</dt><dd>UNAVAILABLE</dd></div>
    </dl>
    <button class="tinc-card__btn" type="button">VIEW PROFILE</button>
  </article>
</section>

<div class="tinc-modal" id="tinc-modal" hidden>
  <div class="tinc-modal__backdrop" data-tinc-close></div>
  <div class="tinc-modal__panel" role="dialog" aria-modal="true" aria-labelledby="tinc-modal-name">
    <button class="tinc-modal__close" type="button" aria-label="Close profile" data-tinc-close>&times;</button>
    <div class="tinc-modal__art"><img id="tinc-modal-img" src="" alt=""></div>
    <div class="tinc-modal__body">
      <p class="tinc-modal__id" id="tinc-modal-id"></p>
      <h3 class="tinc-modal__name tinc-glitch" id="tinc-modal-name"></h3>
      <dl class="tinc-modal__data">
        <div><dt>Status</dt><dd>WRITING</dd></div>
        <div><dt>Human level</dt><dd>QUESTIONABLE</dd></div>
        <div><dt>Digital footprint</dt><dd>UNAVAILABLE</dd></div>
      </dl>
      <p class="tinc-modal__label">Article</p>
      <p class="tinc-modal__article" id="tinc-modal-article"></p>
      <div class="tinc-modal__error">
        <p class="tinc-modal__errhead">SYSTEM ERROR</p>
        <p class="tinc-modal__question" id="tinc-modal-question"></p>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var modal = document.getElementById("tinc-modal");
  var card = document.querySelector(".tinc-card");
  var button = card.querySelector(".tinc-card__btn");

  function openProfile() {
    var img = document.getElementById("tinc-modal-img");
    img.src = card.dataset.image;
    img.alt = "Illustration of contributor " + card.dataset.name;
    document.getElementById("tinc-modal-id").textContent = "ID " + card.dataset.id;
    var nameEl = document.getElementById("tinc-modal-name");
    nameEl.textContent = card.dataset.name;
    nameEl.setAttribute("data-text", card.dataset.name);
    document.getElementById("tinc-modal-article").textContent = card.dataset.article;
    document.getElementById("tinc-modal-question").textContent = card.dataset.question;
    modal.hidden = false;
    document.body.classList.add("tinc-lock");
    modal.querySelector(".tinc-modal__close").focus();
  }
  function closeProfile() {
    modal.hidden = true;
    document.body.classList.remove("tinc-lock");
    button.focus();
  }

  button.addEventListener("click", openProfile);
  modal.querySelectorAll("[data-tinc-close]").forEach(function (el) { el.addEventListener("click", closeProfile); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !modal.hidden) closeProfile(); });
})();
</script>

</body>
</html>
